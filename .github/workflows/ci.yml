name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Typecheck, Lint, Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check (TypeScript)
        run: npx tsc -b

      - name: Lint (Oxlint)
        run: npm run lint

      - name: Unit & Integration Tests (Vitest)
        run: npm test

      - name: Production Build
        run: CI_SKIP_ENV_CHECK=1 npm run build

      - name: Audit Dist Bundle (Secret leak detection)
        run: npm run audit:dist
